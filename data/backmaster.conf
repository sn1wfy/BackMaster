# BackMaster configuration
# Reload after editing:  sudo systemctl reload backmasterd   (or send SIGHUP)
# Blocklist files are re-read on reload; everything else needs a restart.

[general]
log_level   = info
socket      = /run/backmaster/bm.sock
state_dir   = /var/lib/backmaster
config_dir  = /etc/backmaster
# Members of this group may add exclusions and blocks. Everyone else can only read.
admin_group = wheel


[firewall]
enabled = true

# drop  = refuse every inbound connection this machine did not ask for.
#         This is the setting that matters for lobby exploits: the attacker's
#         packets never reach the game's listener in the first place.
# allow = log the probes but let them through.
default_inbound = drop

allow_ping = true

# Set true if you need other machines on your LAN to reach this one
# (file sharing, printers, Steam remote play, local game hosting).
allow_lan = false

# Ports you deliberately expose. Empty means none.
# Example for hosting a game server:  open_ports_udp = 27015, 3074
open_ports_tcp =
open_ports_udp =

# Automatically block an address that port scans this machine.
autoblock      = true
block_ttl      = 3600
scan_threshold = 12
scan_window    = 20

# How many unsolicited packets from one address before it is worth a popup.
probe_alert_threshold = 3


[dns]
# A local resolver that refuses known-bad names. This is what makes a blocked
# site show up as a domain name rather than a bare IP address.
# See the README for pointing systemd-resolved at it.
enabled = true
listen  = 127.0.0.1:5335

upstream = 9.9.9.9:53, 1.1.1.1:53

# nxdomain = tell the client the name does not exist (recommended)
# zero     = answer 0.0.0.0 / ::
block_response = nxdomain


[backdoor]
enabled = true

# Watch for a process opening a port and waiting for connections.
watch_listeners = true

# Watch for a shell whose stdin/stdout are a network socket.
watch_reverse_shell = true

# Watch autostart, systemd units, cron, shell rc files, ld.so.preload, ssh keys.
watch_persistence = true

# Watch the process tree under guarded applications.
watch_lineage = true

# Watch for one process attaching to another's memory.
watch_ptrace = true

# Watch for executables launched out of /tmp and friends.
watch_temp_exec = true

# Kill the offending process instead of only reporting it. Off by default
# because a false positive would take a running game down with it.
kill_on_detect = false

# Any process whose path or command line contains one of these is a guarded
# root: BackMaster then treats its whole process tree as untrusted.
guarded = steam, proton, wine, ModernWarfare, CallOfDuty, Warzone, cod.exe, iw

# Executing one of these inside a guarded tree is treated as an exploit payload.
payload_binaries = sh, bash, dash, zsh, ksh, curl, wget, python, python3, perl,
                   ruby, nc, ncat, netcat, socat, chmod, base64, xxd, systemctl,
                   crontab, powershell.exe, cmd.exe, certutil.exe, bitsadmin.exe,
                   rundll32.exe, regsvr32.exe, mshta.exe

# Paths that are never treated as payloads. Proton and the Steam runtime start
# a great many helpers legitimately.
ignore = /usr/lib/steam, steamwebhelper, /proton, pressure-vessel, steam-runtime

# Guarded applications exec a lot of helpers while starting. Ignore lineage
# events for this many seconds after the guarded process appears.
lineage_grace = 45

temp_dirs = /tmp/, /var/tmp/, /dev/shm/, /run/user/, /.cache/


[alerts]
# Everything at or above this is recorded in /var/lib/backmaster/alerts.jsonl.
min_severity = low

# Everything at or above this interrupts you with a popup.
popup_min_severity = medium

# The same finding will not raise a second popup within this many seconds.
dedup_seconds = 30

max_alerts_kept = 2000
